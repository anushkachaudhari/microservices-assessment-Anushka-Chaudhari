version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres-db
    environment:
      POSTGRES_DB: ecommerce_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  notification-service:
    image: canushka02/notification-service:latest
    container_name: notification-service
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/ecommerce_db
    depends_on:
      - postgres

  order-service:
    image: canushka02/order-service:latest
    container_name: order-service
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/ecommerce_db
      - NOTIFICATION_SERVICE_URL=http://notification-service:8081
    depends_on:
      - postgres
      - notification-service

volumes:
  pgdata:
