server:
  port: 8081
spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/ecommerce_db
    username: postgres
    password: password
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
  api-docs:
    path: /v3/api-docs
