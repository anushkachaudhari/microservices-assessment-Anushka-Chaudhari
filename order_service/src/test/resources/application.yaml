server:
  port: 0

spring:
  datasource:
    url: jdbc:h2:mem:ecommerce_test_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true

notification:
  service:
    url: http://localhost:8081

logging:
  level:
    root: INFO
    com.ecommerce: DEBUG
